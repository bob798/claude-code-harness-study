name: research-experiments
on:
  push:
  pull_request:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s experiments/loop_recovery -p 'test_*.py' -v
      - run: python -m unittest discover -s experiments/r1_state -p 'test_*.py' -v
      - run: python -m unittest discover -s experiments/r1_transitions -p 'test_*.py' -v
      - run: python -m unittest discover -s experiments/r1_recovery -p 'test_*.py' -v
      - run: python -m unittest discover -s research/A0-01-agent-loop-path/a0_02 -p 'test_*.py' -v
      - run: python -m unittest discover -s research/A0-01-agent-loop-path/a0_02 -p 'test_session_analyzer.py' -v
      - run: python -m unittest discover -s experiments/a0_04_loop_comparison -p 'test_*.py' -v
      - run: python -m unittest discover -s experiments/a0_04_02_approval -p 'test_*.py' -v
